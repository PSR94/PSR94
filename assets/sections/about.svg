<svg width="1200" height="410" viewBox="0 0 1200 410" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hello, I'm Pavan</title>
  <desc id="desc">AI Software Engineer building full-stack AI products, modern data systems, and open-source improvements.</desc>
  <defs>
    <linearGradient id="bg" x1="32" y1="24" x2="1168" y2="386" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081321"/><stop offset="0.58" stop-color="#0B172A"/><stop offset="1" stop-color="#18152F"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/><stop offset="0.52" stop-color="#8B5CF6"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#94A3B8" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="408" rx="26" fill="url(#bg)" stroke="#273449" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="408" rx="26" fill="url(#grid)"/>
  <circle cx="1110" cy="52" r="190" fill="#8B5CF6" fill-opacity="0.08"/>
  <circle cx="936" cy="410" r="205" fill="#0284C7" fill-opacity="0.07"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
    <rect x="68" y="52" width="142" height="32" rx="16" fill="#0C2237" stroke="#155E75"/>
    <circle cx="88" cy="68" r="5" fill="#34D399"/>
    <text x="103" y="73" fill="#BAE6FD" font-size="13" font-weight="700" letter-spacing="1.6">PROFILE / 01</text>

    <text x="68" y="148" fill="#F8FAFC" font-size="46" font-weight="760" letter-spacing="-1">Hello — I'm Pavan.</text>
    <text x="68" y="199" fill="#C4B5FD" font-size="28" font-weight="650">I turn data, context, and models into useful products.</text>

    <text x="68" y="244" fill="#A7B3C7" font-size="18">AI Software Engineer building full-stack AI applications and modern data systems—</text>
    <text x="68" y="272" fill="#A7B3C7" font-size="18">from governed foundations and grounded retrieval to tool-using workflows and operator UX.</text>

    <g font-size="13" font-weight="700" letter-spacing="0.7">
      <rect x="68" y="306" width="146" height="36" rx="18" fill="#0A2940" stroke="#075985"/>
      <text x="141" y="329" text-anchor="middle" fill="#7DD3FC">AGENTIC SYSTEMS</text>
      <rect x="226" y="306" width="173" height="36" rx="18" fill="#201B42" stroke="#6D28D9"/>
      <text x="312" y="329" text-anchor="middle" fill="#C4B5FD">RAG + KNOWLEDGE</text>
      <rect x="411" y="306" width="192" height="36" rx="18" fill="#102A24" stroke="#047857"/>
      <text x="507" y="329" text-anchor="middle" fill="#6EE7B7">FABRIC + AZURE</text>
      <rect x="615" y="306" width="175" height="36" rx="18" fill="#2D2012" stroke="#B45309"/>
      <text x="702" y="329" text-anchor="middle" fill="#FCD34D">OPEN SOURCE</text>
    </g>

    <rect x="840" y="108" width="278" height="174" rx="22" fill="#0B1424" stroke="#334155"/>
    <text x="870" y="142" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.8">SYSTEM LENS</text>
    <g font-size="14" font-weight="650">
      <circle cx="875" cy="177" r="5" fill="#38BDF8"/><text x="892" y="182" fill="#CBD5E1">Ground the answer</text>
      <circle cx="875" cy="210" r="5" fill="#8B5CF6"/><text x="892" y="215" fill="#CBD5E1">Control the workflow</text>
      <circle cx="875" cy="243" r="5" fill="#34D399"/><text x="892" y="248" fill="#CBD5E1">Prove the behavior</text>
    </g>

    <rect x="68" y="370" width="1064" height="2" rx="1" fill="url(#accent)" opacity="0.75"/>
    <text x="68" y="393" fill="#64748B" font-size="12" font-weight="600" letter-spacing="0.5">NORTH STAR</text>
    <text x="170" y="393" fill="#CBD5E1" font-size="14">Grounded enough to trust · Observable enough to improve · Simple enough to use</text>
  </g>
</svg>
