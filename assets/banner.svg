<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pavan Sai R — AI Software Engineer</title>
  <desc id="desc">A dark technical banner showing a path from data through context and agents to useful products.</desc>
  <defs>
    <linearGradient id="background" x1="24" y1="20" x2="1176" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B172A"/>
      <stop offset="1" stop-color="#15142A"/>
    </linearGradient>
    <linearGradient id="line" x1="760" y1="84" x2="1094" y2="274" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="name" x1="72" y1="142" x2="524" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.7" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.075"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#background)" stroke="#273449" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#grid)"/>
  <circle cx="1128" cy="-12" r="190" fill="#8B5CF6" fill-opacity="0.09"/>
  <circle cx="768" cy="390" r="220" fill="#0284C7" fill-opacity="0.08"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="72" y="62" width="196" height="34" rx="17" fill="#0C2237" stroke="#155E75"/>
    <circle cx="92" cy="79" r="5" fill="#34D399"/>
    <text x="108" y="84" fill="#BAE6FD" font-size="14" font-weight="700" letter-spacing="1.7">AI SOFTWARE ENGINEER</text>

    <text x="70" y="174" fill="url(#name)" font-size="58" font-weight="750" letter-spacing="-1.5">Pavan Sai R</text>
    <text x="72" y="216" fill="#A5B4FC" font-size="22" font-weight="600">Data foundations · Retrieval · Agents · AI products</text>
    <text x="72" y="255" fill="#94A3B8" font-size="18">Building intelligent systems that are grounded, observable,</text>
    <text x="72" y="282" fill="#94A3B8" font-size="18">and ready for real workflows.</text>

    <rect x="72" y="310" width="92" height="4" rx="2" fill="#38BDF8"/>
    <rect x="170" y="310" width="58" height="4" rx="2" fill="#8B5CF6"/>
    <rect x="234" y="310" width="34" height="4" rx="2" fill="#34D399"/>
  </g>

  <g stroke="url(#line)" stroke-width="2">
    <path d="M748 180H822"/>
    <path d="M910 180H984"/>
    <path d="M1072 180H1112"/>
    <path d="M786 112L866 164" stroke-opacity="0.55"/>
    <path d="M866 196L786 248" stroke-opacity="0.55"/>
    <path d="M1028 134V164" stroke-opacity="0.55"/>
    <path d="M1028 196V226" stroke-opacity="0.55"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <circle cx="704" cy="180" r="44" fill="#0B1F32" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="704" cy="180" r="7" fill="#38BDF8" filter="url(#glow)"/>
      <text x="704" y="244" text-anchor="middle" fill="#BAE6FD" font-size="13" font-weight="700" letter-spacing="1.4">DATA</text>
    </g>
    <g>
      <circle cx="866" cy="180" r="44" fill="#181A38" stroke="#8B5CF6" stroke-width="2"/>
      <path d="M850 180L862 192L883 167" stroke="#A78BFA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="866" y="244" text-anchor="middle" fill="#DDD6FE" font-size="13" font-weight="700" letter-spacing="1.4">CONTEXT</text>
    </g>
    <g>
      <circle cx="1028" cy="180" r="44" fill="#10251F" stroke="#34D399" stroke-width="2"/>
      <circle cx="1017" cy="174" r="6" fill="#6EE7B7"/>
      <circle cx="1039" cy="174" r="6" fill="#6EE7B7"/>
      <path d="M1016 191H1040" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round"/>
      <text x="1028" y="244" text-anchor="middle" fill="#A7F3D0" font-size="13" font-weight="700" letter-spacing="1.4">AGENTS</text>
    </g>

    <g fill="#0E1A2B" stroke="#334155">
      <rect x="748" y="84" width="76" height="34" rx="17"/>
      <rect x="748" y="242" width="76" height="34" rx="17"/>
      <rect x="988" y="92" width="80" height="34" rx="17"/>
      <rect x="988" y="234" width="80" height="34" rx="17"/>
    </g>
    <g fill="#CBD5E1" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">
      <text x="786" y="105">GOVERN</text>
      <text x="786" y="263">RETRIEVE</text>
      <text x="1028" y="113">EVALUATE</text>
      <text x="1028" y="255">OBSERVE</text>
    </g>

    <rect x="1110" y="150" width="62" height="60" rx="16" fill="#121E2E" stroke="#475569"/>
    <path d="M1129 180L1139 190L1156 170" stroke="#F8FAFC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1141" y="228" text-anchor="middle" fill="#E2E8F0" font-size="11" font-weight="700" letter-spacing="0.9">SHIP</text>
  </g>
</svg>
