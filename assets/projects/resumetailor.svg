    <rect x="42" y="42" width="72" height="72" rx="20" fill="#16331F" stroke="#16A34A"/><path d="M62 58H87L99 70V101H62V58Z" stroke="#BBF7D0" stroke-width="4" stroke-linejoin="round"/><path d="M87 58V71H99M69 81H91M69 91H86" stroke="#86EFAC" stroke-width="3" stroke-linecap="round"/>
