<svg width="1200" height="230" viewBox="0 0 1200 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ResumeTailor</title><desc id="desc">Local format-preserving resume tailoring built with React, TypeScript, FastAPI, and python-docx.</desc>
