    <text x="144" y="104" fill="#F8FAFC" font-size="34" font-weight="760">ContextMesh</text>
    <text x="144" y="137" fill="#CBD5E1" font-size="18" font-weight="600">Hybrid retrieval, graph-aware context, query planning, reranking, and evidence cards.</text>
